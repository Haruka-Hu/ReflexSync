[platformio]
default_envs = master, slave-01, slave-02, motor

[env]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_8MB.csv

monitor_speed = 4000000
monitor_filters = send_on_enter
monitor_rts = 0

[env:master]
; Master 使用 TinyUSB CDC 获得高于 USB-Serial/JTAG 的持续吞吐。
board_build.arduino.memory_type = qio_opi
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=0
    -DBOARD_HAS_PSRAM
build_src_filter =
    -<*>
    +<master/>

[env:slave-01]
build_flags =
    ${env.build_flags}
    -DCONFIG_ESP_WIFI_STA_DISCONNECTED_PM_ENABLE=1
board_upload.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
build_src_filter =
    -<*>
    +<slave-01/>

[env:slave-02]
build_flags =
    ${env.build_flags}
    -DCONFIG_ESP_WIFI_STA_DISCONNECTED_PM_ENABLE=1
board_upload.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
build_src_filter =
    -<*>
    +<slave-02/>

[env:motor]
platform = espressif32@6.13.0
; Matches rotary_hammer_contact_coast's N16R8 motor board.
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
monitor_speed = 115200
build_src_filter =
    -<*>
    +<motor/>

[env:slave-01-biger-buffer]
build_flags = ${env:slave-01.build_flags}
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter =
    -<*>
    +<slave-01/>

[env:slave-02-biger-buffer]
build_flags = ${env:slave-02.build_flags}
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter =
    -<*>
    +<slave-02/>
